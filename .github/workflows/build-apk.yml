name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Generate Android project, icons, sync config
        run: |
          npm ci
          npx cap add android
          npx capacitor-assets generate
          npx cap sync android

      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          cd android
          sh ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee ../gradle-build.log
          ls -la app/build/outputs/apk/debug/app-debug.apk

      - name: Surface gradle errors as annotations
        if: failure()
        shell: bash
        run: |
          tail -25 gradle-build.log 2>/dev/null | sed 's/^/::error::/' || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: brightsteps-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
