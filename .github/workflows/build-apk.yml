name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile
    env:
      ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/mobile/release.keystore
      ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Generate Android project, icons, sync config
        run: |
          npm ci
          npx cap add android
          npx capacitor-assets generate
          npx cap sync android

      - name: Apply release signing (skipped until secrets exist)
        shell: bash
        run: |
          if [ -z "$ANDROID_KEYSTORE_B64" ]; then
            echo "::warning::Release-keystore secrets not configured — falling back to DEBUG signing (Play Protect flags debug builds as suspicious)."
            exit 0
          fi
          printf '%s' "$ANDROID_KEYSTORE_B64" | base64 -d > release.keystore
          cat >> android/app/build.gradle <<'EOF'

          // Release signing from CI secrets — the Android debug key makes
          // Play Protect label the APK "suspicious".
          android {
              signingConfigs {
                  release {
                      storeFile file(System.getenv("ANDROID_KEYSTORE_PATH"))
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          EOF
          echo "Release signing applied."

      - name: Build APK (release when signed, debug fallback)
        shell: bash
        run: |
          set -o pipefail
          cd android
          if [ -f ../release.keystore ]; then
            TARGET=assembleRelease
            OUT=app/build/outputs/apk/release/app-release.apk
          else
            TARGET=assembleDebug
            OUT=app/build/outputs/apk/debug/app-debug.apk
          fi
          echo "Building $TARGET"
          sh ./gradlew "$TARGET" --no-daemon --stacktrace 2>&1 | tee ../gradle-build.log
          ls -la "$OUT"

      - name: Surface gradle errors as annotations
        if: failure()
        shell: bash
        run: |
          LOG=gradle-build.log
          [ -f "$LOG" ] || { echo "::error::gradle-build.log missing"; exit 0; }
          hits=$(grep -E "FAILURE:|Execution failed for task|What went wrong|Caused by:|Could not resolve|Failed to find|error:" "$LOG" | head -30)
          if [ -n "$hits" ]; then
            echo "$hits" | sed 's/^/::error::/'
          else
            head -40 "$LOG" | sed 's/^/::error::/'
          fi
          sed -n '/What went wrong/{n;p;}' "$LOG" | sed 's/^/::error::/'

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: brightsteps-apk
          path: mobile/android/app/build/outputs/apk/*/*.apk
          if-no-files-found: error
          retention-days: 30
