[theme]
base = "light"
primaryColor = "#6C5CE7"
backgroundColor = "#F5F6FA"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#111827"
font = "sans serif"

[browser]
gatherUsageStats = false

[server]
headless = true
maxUploadSize = 5
enableXsrfProtection = true
enableCORS = true

[client]
showErrorDetails = false
