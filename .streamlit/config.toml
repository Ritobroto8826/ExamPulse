[theme]
base = "light"
primaryColor = "#7C3AED"
backgroundColor = "#F7F7FF"
secondaryBackgroundColor = "#F0F1FE"
textColor = "#16142B"
font = "sans serif"

[browser]
gatherUsageStats = false

[server]
headless = true
maxUploadSize = 5
enableXsrfProtection = true
enableCORS = true

[client]
showErrorDetails = false
